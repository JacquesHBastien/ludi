<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game over</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&amp;family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2C14E}a:hover{color:#FFE29A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background-color: #3A2416; background-image: repeating-linear-gradient(92deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 5px, rgba(255,255,255,0.02) 5px, rgba(255,255,255,0.02) 11px), repeating-linear-gradient(88deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0) 3px, rgba(0,0,0,0) 37px); color: #F4E9D4; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; padding: 48px 20px 22px; gap: 24px; overflow: hidden">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
    <div style="display: flex; gap: 4px" aria-hidden="true">
      <div style="width: 40px; height: 6px; border-radius: 3px; background: #B5232A"></div>
      <div style="width: 40px; height: 6px; border-radius: 3px; background: #E8B21C"></div>
      <div style="width: 40px; height: 6px; border-radius: 3px; background: #2F7D32"></div>
    </div>
    <div style="position: relative; height: 130px; width: 240px" aria-hidden="true">
      <sc-for list="{{r.caps}}" as="c" hint-placeholder-count="1">
        <div style="{{c.style}}">
          <svg width="{{c.size}}" height="{{c.size}}" viewBox="0 0 20 20" style="display: block">
            <circle cx="10" cy="10" r="8.7" fill="{{c.color}}" stroke="{{c.edge}}" stroke-width="2.4" stroke-dasharray="1.5 1.1"/>
            <circle cx="10" cy="10" r="6.2" fill="none" stroke="{{c.edge}}" stroke-opacity="0.55" stroke-width="0.8"/>
            <g transform="translate(5 5) scale(0.5)"><path d="{{c.mark}}" fill="{{c.markFill}}"/></g>
          </svg>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 15px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; opacity: 0.85">{{r.kicker}}</div>
      <div style="font-family: 'Caveat Brush', cursive; font-size: 66px; line-height: 0.95; color: #F2C14E">{{r.title}}</div>
      <div style="font-size: 17px; font-weight: 700; opacity: 0.92">{{r.sub}}</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{r.rows}}" as="row" hint-placeholder-count="4">
      <div style="{{row.style}}">
        <div style="width: 34px; font-family: 'Caveat Brush', cursive; font-size: 26px; text-align: center">{{row.place}}</div>
        <svg width="30" height="30" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="10" r="8.7" fill="{{row.color}}" stroke="{{row.edge}}" stroke-width="2.4" stroke-dasharray="1.5 1.1"/>
          <g transform="translate(5 5) scale(0.5)"><path d="{{row.mark}}" fill="{{row.markFill}}"/></g>
        </svg>
        <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
          <div style="font-size: 17px; font-weight: 900">{{row.name}}</div>
          <div style="font-family: 'Caveat Brush', cursive; font-size: 16px; line-height: 1; opacity: 0.8">{{row.parish}}</div>
        </div>
        <div style="font-size: 14px; font-weight: 800; opacity: 0.9">{{row.home}}/4 home</div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <button style="height: 64px; border-radius: 16px; background: #E8B21C; color: #1B1714; border: 3px solid #1B1714; box-shadow: 0 6px 0 #1B1714; font-size: 21px; font-weight: 900; cursor: pointer">Play again</button>
    <a href="Home.dc.html" style="height: 52px; border-radius: 16px; background: rgba(0,0,0,0.3); color: #F4E9D4; border: 2px solid #8A6A44; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Back to start</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"result":{"editor":"enum","options":["Winner","Heaven-less draw"],"default":"Winner"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var P = {
      red: { color: '#B5232A', mark: 'M10 2l8 8-8 8-8-8z', edge: '#1B1714', markFill: '#F4E9D4', name: 'Auntie Bev', parish: 'St. Elizabeth' },
      gold: { color: '#E8B21C', mark: 'M10 3l8 14H2z', edge: '#1B1714', markFill: '#1B1714', name: 'Marlon', parish: 'St. Andrew' },
      green: { color: '#2F7D32', mark: 'M10 3a7 7 0 1 0 0.01 0z', edge: '#1B1714', markFill: '#F4E9D4', name: 'Keisha', parish: 'St. Mary' },
      black: { color: '#1B1714', mark: 'M4 4h12v12H4z', edge: '#E8D9B8', markFill: '#E8B21C', name: 'Junior', parish: 'St. Ann' }
    };
    function cap(k, x, y, size) {
      return Object.assign({}, P[k], { size: size, style: 'position: absolute; left: ' + x + 'px; top: ' + y + 'px; filter: drop-shadow(0 5px 0 rgba(0,0,0,0.6));' });
    }
    function row(k, place, home, lead) {
      return Object.assign({}, P[k], {
        place: place, home: home,
        style: 'display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px; border-radius: 14px; ' +
          (lead ? 'background: #17110D; border: 2px solid #E8B21C;' : 'background: rgba(0,0,0,0.28); border: 2px solid rgba(255,255,255,0.08);')
      });
    }
    var draw = this.props.result === 'Heaven-less draw';
    var r = draw ? {
      kicker: 'Heaven-less',
      title: "It's a draw",
      sub: 'Everybody got a man to heaven.',
      caps: [cap('red', 0, 34, 70), cap('gold', 56, 18, 70), cap('green', 112, 34, 70), cap('black', 168, 18, 70)],
      rows: [row('red', '=', 1), row('gold', '=', 2), row('green', '=', 1), row('black', '=', 1)]
    } : {
      kicker: 'Keisha wins',
      title: 'Run yard!',
      sub: 'All four men reach heaven for St. Mary.',
      caps: [cap('green', 58, 0, 124)],
      rows: [row('green', '1', 4, true), row('black', '2', 3), row('gold', '3', 1), row('red', '4', 0)]
    };
    return { r: r };
  }
}
</script>
</body>
</html>
